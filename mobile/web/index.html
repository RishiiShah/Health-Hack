<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cerevia mobile shifts and coverage requests.">
  <meta name="theme-color" content="#B8D8EB">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cerevia">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Cerevia Command Center</title>
  <style>
    body { margin: 0; background: #EDF1F4; color: #0F1A27; font-family: system-ui, sans-serif; }
    #loading { min-height: 100dvh; display: grid; place-content: center; padding: 0 24px; text-align: center; }
    h1 { margin-bottom: 8px; font-size: 36px; }
    p { line-height: 1.6; }
  </style>
</head>
<body>
  <main id="loading" role="status" aria-live="polite">
    <h1>Cerevia</h1>
    <p>Command Center<br>Loading your workspace…</p>
    <noscript>Enable JavaScript to open Cerevia.</noscript>
  </main>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('loading')?.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
