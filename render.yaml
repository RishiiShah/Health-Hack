services:
  - type: web
    name: sevaro-command-center-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .  # repository root: the image also builds and serves web/
    plan: starter
    region: oregon  # same AWS region as the RDS instance (us-west-2)
    numInstances: 1
    healthCheckPath: /ready
    envVars:
      - key: CC_DATABASE_URL  # RDS URL with sslmode=verify-full; set in the dashboard
        sync: false
      - key: CC_USERS  # JSON accounts with PBKDF2 hashes (python -m app.auth); set in the dashboard
        sync: false
      - key: CC_AUTH_SECRET  # 32+ random characters for signing sign-in tokens
        sync: false
      - key: CC_CLOCK_MODE
        value: auto
      - key: CC_TOKEN_SECRET  # signs physician links; Render generates it
        generateValue: true
      # Optional fixed role tokens (CC_COORDINATOR_TOKEN, CC_LEAD_TOKEN, CC_ADMIN_TOKEN) can be added in the dashboard later.
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
