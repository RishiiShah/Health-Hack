name: application-ci
on:
  push:
  pull_request:
jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Install the verified Flutter toolchain
        run: |
          git clone --depth 1 --branch 3.35.3 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Compile the connected web application
        run: flutter build web --release --no-pub --dart-define=API_MODE=live --dart-define=API_BASE_URL=https://backend.example
      - name: Compile the presentation backup
        run: flutter build web --release --no-pub --dart-define=API_MODE=fake
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      CC_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - run: pip install -e '.[test]'
      - name: Verify the independent practice-data generator
        working-directory: .
        run: python -m unittest discover scripts/synth -v
      - name: Generate the five public rehearsal datasets
        working-directory: .
        run: python scripts/synth/generate.py --suite --out data/synthetic
      # Protected packs remain local. Synthetic API/auth/offer/recovery tests run in this checkout.
      - run: pytest -ra
  container:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      # Throwaway CI tokens; the smoke script reads the same variables.
      CC_ADMIN_TOKEN: ci-admin
      CC_COORDINATOR_TOKEN: ci-coordinator
      RUN: docker run -d --name cc-backend --network host -e PORT=10000 -e CC_ADMIN_TOKEN=ci-admin -e CC_COORDINATOR_TOKEN=ci-coordinator -e CC_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/postgres cc-backend:ci
    steps:
      - uses: actions/checkout@v4
      - name: Build the portable image
        run: docker build -f backend/Dockerfile -t cc-backend:ci .
      - name: Start against Postgres on a Render-style port
        run: $RUN
      - name: Probe and commit a synthetic consult
        run: python3 scripts/hosting_smoke.py seed --url http://127.0.0.1:10000
      - name: Check the container's own health probe
        run: docker exec cc-backend python -m app.healthcheck
      - name: Replace the container; the database keeps the events
        run: |
          docker stop cc-backend
          docker rm cc-backend
          $RUN
      - name: Verify replay from persisted events
        run: python3 scripts/hosting_smoke.py verify --url http://127.0.0.1:10000
      - name: Show logs and clean up the test container
        if: always()
        run: |
          docker logs cc-backend
          docker rm -f cc-backend
