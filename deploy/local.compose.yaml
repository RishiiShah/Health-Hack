# Local development only. Does not use RDS or publish a database port.
name: sevaro-local
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: cc
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: command_center
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cc -d command_center"]
      interval: 2s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: ../backend
    environment:
      CC_DATABASE_URL: postgresql://cc:local-development-only@postgres:5432/command_center
      CC_AUTH_CONFIG: /run/cc/auth.json
      PORT: "8000"
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    volumes:
      - ../backend/app:/app/app:ro
      - ${CC_LOCAL_AUTH_FILE:-../backend/.local/auth.json}:/run/cc/auth.json:ro
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
  tests:
    profiles: ["test"]
    build:
      context: ../backend
      dockerfile: Dockerfile.test
    environment:
      CC_TEST_DATABASE_URL: postgresql://cc:local-development-only@postgres:5432/command_center
      CC_AUTH: "off"
    volumes:
      - ../backend/tests:/app/tests:ro
      - ../scripts:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
